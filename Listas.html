<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas de tareas</title>
    <style>
        .completada {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>
    <h1>Mis Tareas</h1>
    <input type="text" id="entrada" placeholder="Escribe una tarea">
    <button id="agregar">Agregar</button>
    <button id="reiniciar">Reset</button>

    <ul id="lista"></ul>
    <p id="contador">Tareas pendientes: 0</p>

    <script src="lista.js"></script>
</body>
</html>
